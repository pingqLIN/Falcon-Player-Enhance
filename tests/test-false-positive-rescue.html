<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcon False Positive Rescue Regression</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101820;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }

    main {
      display: grid;
      gap: 16px;
      width: min(460px, calc(100vw - 48px));
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 14px 18px;
      background: #10b981;
      color: #052e16;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .metrics {
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <p>The primary action is intentionally matched by a custom hidden-element rule.</p>
    <button class="blocked-cta" id="checkout-button" type="button">Continue checkout</button>
    <div class="metrics" id="metrics"></div>
  </main>

  <script>
    window.__falconRescueMetrics = { checkoutClicks: 0 };

    document.getElementById('checkout-button').addEventListener('click', () => {
      window.__falconRescueMetrics.checkoutClicks += 1;
      renderMetrics();
    });

    function renderMetrics() {
      document.getElementById('metrics').textContent = JSON.stringify(window.__falconRescueMetrics);
    }

    renderMetrics();
  </script>
</body>
</html>
