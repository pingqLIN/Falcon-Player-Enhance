<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcon Popup Spawn Guard Host</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #111827, #020617);
      color: #e5eefc;
    }
    .shell {
      width: min(960px, calc(100vw - 48px));
      margin: 48px auto;
      display: grid;
      gap: 24px;
    }
    .hero {
      padding: 28px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
    }
    .player-shell {
      padding: 20px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    iframe {
      width: 100%;
      height: 420px;
      border: 0;
      border-radius: 18px;
      background: #020617;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>Falcon Popup Spawn Guard Host</h1>
      <p>This page emulates a managed player site with a cross-origin iframe that attempts to spawn a suspicious popup tab.</p>
    </section>
    <section class="player-shell">
      <iframe
        id="trap-frame"
        src="http://popup-source.test:0/tests/test-popup-spawn-child.html"
        title="Cross-origin popup source"
      ></iframe>
    </section>
  </div>
  <script>
    const frame = document.getElementById('trap-frame');
    const src = new URL(frame.getAttribute('src'), window.location.href);
    src.port = window.location.port;
    frame.src = src.toString();
  </script>
</body>
</html>
