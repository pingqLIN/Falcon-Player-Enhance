<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Spawn Child</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #111827, #1d4ed8);
    }
    a {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    span {
      padding: 18px 24px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
  </style>
</head>
<body>
  <a id="trap-link" href="http://displayendpointstarring.com:0/tests/test-popup-trap-destination.html" target="_blank" rel="noopener noreferrer">
    <span>Open Player</span>
  </a>
  <script>
    const link = document.getElementById('trap-link');
    const target = new URL(link.getAttribute('href'), window.location.href);
    target.port = window.location.port;
    link.href = target.toString();
  </script>
</body>
</html>
